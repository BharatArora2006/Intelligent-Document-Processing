services:
  postgres:
    image: postgres:16
    container_name: idp_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: dependent_verification
      POSTGRES_USER: idp_admin
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idp_admin -d dependent_verification"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
